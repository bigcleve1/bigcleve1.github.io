<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOOM526</title>
    <style>
        /* ========== Windows 95 全局样式 ========== */
        body {
            margin: 0;
            padding: 0;
            background: #008080; /* 经典桌面背景 */
            font-family: "MS Sans Serif", "Arial", sans-serif;
            color: black;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 画布容器 */
        #canvas-container {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            width: 100%;
            margin-bottom: 10px;
            background: #c0c0c0;
            border: 3px solid #dfdfdf;
            border-right-color: #404040;
            border-bottom-color: #404040;
            padding: 10px;
            box-sizing: border-box;
        }

        canvas {
            display: block;
            width: auto;
            height: 100%;
            max-width: 100%;
            max-height: 60vh; /* 稍微降低，为数字按钮留空间 */
            background: #000;
            border: 2px solid #808080;
            outline: none;
            image-rendering: pixelated;
        }

        /* ========== 控制面板 (响应式) ========== */
        #controls-panel {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2vw;
            padding: 2vh 2vw;
            background: #c0c0c0;
            border: 3px solid #dfdfdf;
            border-right-color: #404040;
            border-bottom-color: #404040;
            box-sizing: border-box;
            flex-wrap: nowrap;
            margin-bottom: 10px;
        }

        /* 摇杆区域 (左侧) */
        .joystick-area {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 100px;
        }

        .joystick {
            position: relative;
            width: 15vw;
            max-width: 140px;
            min-width: 90px;
            aspect-ratio: 1 / 1;
            background: #a0a0a0;
            border: 3px solid #dfdfdf;
            border-right-color: #404040;
            border-bottom-color: #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
        }

            .joystick:active {
                cursor: grabbing;
            }

        .joystick-head {
            width: 40%;
            aspect-ratio: 1 / 1;
            background: #c0c0c0;
            border: 3px solid #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            transition: transform 0.02s linear;
            pointer-events: none;
            will-change: transform;
            box-sizing: border-box;
        }

        /* 中间功能按钮区域 */
        .action-area {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5vw;
            min-width: 200px;
        }

        .action-button {
            flex: 0 1 auto;
            min-width: 60px;
            height: 7vh;
            max-height: 65px;
            min-height: 40px;
            background: #c0c0c0;
            border: 3px solid #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            color: black;
            font-size: clamp(12px, 2vw, 18px);
            font-weight: bold;
            font-family: "MS Sans Serif", "Arial", sans-serif;
            padding: 0 2vw;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            text-transform: uppercase;
            white-space: nowrap;
            box-sizing: border-box;
        }

            .action-button:active {
                border: 3px solid #808080;
                border-right-color: #ffffff;
                border-bottom-color: #ffffff;
                background: #a0a0a0;
                transform: translate(1px, 1px);
            }

        /* 射击按钮（右侧） */
        .fire-area {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 80px;
        }

        .fire-button {
            width: 12vw;
            max-width: 110px;
            min-width: 70px;
            aspect-ratio: 1 / 1;
            background: #c0c0c0;
            border: 4px solid #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            color: black;
            font-size: clamp(16px, 3vw, 24px);
            font-weight: bold;
            font-family: "MS Sans Serif", "Arial", sans-serif;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }

            .fire-button:active {
                border: 4px solid #808080;
                border-right-color: #ffffff;
                border-bottom-color: #ffffff;
                background: #a0a0a0;
                transform: translate(2px, 2px);
            }

        /* ========== 数字按钮区域（新增） ========== */
        #number-panel {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5vw;
            padding: 1.5vh 1vw;
            background: #c0c0c0;
            border: 3px solid #dfdfdf;
            border-right-color: #404040;
            border-bottom-color: #404040;
            box-sizing: border-box;
            margin-bottom: 10px;
            flex-wrap: wrap; /* 允许换行，但尽量在一行 */
        }

        .number-button {
            flex: 0 1 auto;
            width: 8vw;
            max-width: 70px;
            min-width: 45px;
            aspect-ratio: 1 / 1;
            background: #c0c0c0;
            border: 3px solid #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            color: black;
            font-size: clamp(16px, 3vw, 24px);
            font-weight: bold;
            font-family: "MS Sans Serif", "Arial", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }

            .number-button:active {
                border: 3px solid #808080;
                border-right-color: #ffffff;
                border-bottom-color: #ffffff;
                background: #a0a0a0;
                transform: translate(1px, 1px);
            }

        /* 底部提示 */
        .hint {
            color: white;
            font-size: clamp(10px, 1.5vw, 14px);
            text-align: center;
            background: #000080;
            padding: 5px 15px;
            border: 2px solid #dfdfdf;
            border-right-color: #404040;
            border-bottom-color: #404040;
            font-family: "MS Sans Serif", "Arial", sans-serif;
            width: fit-content;
            max-width: 95%;
            white-space: nowrap;
            margin-top: 5px;
        }

        /* 极端小屏幕 */
        @media (max-width: 500px) {
            #number-panel {
                gap: 1vw;
            }

            .number-button {
                min-width: 35px;
                font-size: 14px;
            }

            .action-button {
                font-size: 11px;
                padding: 0 5px;
            }
        }

        /* ========== 隐藏辅助元素 ========== */
        .hidden-helper {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
            pointer-events: none;
        }

        #output {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
    <!-- 保留所有 main.js 必需的隐藏元素 -->
    <div id="output"></div>
    <p id="focushint" class="hidden-helper"></p>
    <button id="enterButton" class="hidden-helper"></button>
    <button id="leftButton" class="hidden-helper"></button>
    <button id="upButton" class="hidden-helper"></button>
    <button id="downButton" class="hidden-helper"></button>
    <button id="rightButton" class="hidden-helper"></button>
    <button id="ctrlButton" class="hidden-helper"></button>
    <button id="spaceButton" class="hidden-helper"></button>
    <button id="altButton" class="hidden-helper"></button>
    <span id="getmsps_stats" class="hidden-helper">0</span>
    <span id="getms_stats" class="hidden-helper">0</span>
    <span id="fps_stats" class="hidden-helper">0</span>
    <span id="drawframes_stats" class="hidden-helper">0</span>
    <span id="animationfps_stats" class="hidden-helper">0</span>

    <div id="game-wrapper">
        <!-- 画布容器 -->
        <div id="canvas-container">
            <canvas id="screen" width="640" height="400" tabindex="0">This is where the DooM screen should render.</canvas>
        </div>

        <!-- 控制面板 (主按键) -->
        <div id="controls-panel">
            <!-- 左侧摇杆 -->
            <div class="joystick-area">
                <div class="joystick" id="joystick">
                    <div class="joystick-head" id="joystick-head"></div>
                </div>
            </div>

            <!-- 中间功能按钮：选择(Enter)、使用(Space)、返回(Esc) -->
            <div class="action-area">
                <div class="action-button" id="enterBtn">选择</div>
                <div class="action-button" id="spaceBtn">使用</div>
                <div class="action-button" id="escBtn">返回</div>
            </div>

            <!-- 右侧射击按钮 (Ctrl) -->
            <div class="fire-area">
                <div class="fire-button" id="fireBtn">射击</div>
            </div>
        </div>

        <!-- 新增数字按钮区域 (1-9) 用于切换武器 -->
        <div id="number-panel">
            <div class="number-button" id="num1">1</div>
            <div class="number-button" id="num2">2</div>
            <div class="number-button" id="num3">3</div>
            <div class="number-button" id="num4">4</div>
            <div class="number-button" id="num5">5</div>
            <div class="number-button" id="num6">6</div>
            <div class="number-button" id="num7">7</div>
            <div class="number-button" id="num8">8</div>
            <div class="number-button" id="num9">9</div>
        </div>

        <!-- 底部提示 -->
        <div class="hint">你们好震撼首发</div>
    </div>

    <!-- 原有的 main.js 必须保留 -->
    <script src="main.js" defer></script>

    <!-- 自定义虚拟摇杆 + 按钮逻辑 (增加数字键支持) -->
    <script>
        (function() {
        const canvas = document.getElementById('screen');

        // ---------- 键盘事件模拟器 ----------
        function dispatchKeyEvent(type, key, code, keyCode) {
        const event = new KeyboardEvent(type, {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
        });
        canvas.dispatchEvent(event);
        document.dispatchEvent(event);
        }

        // 扩展 keyMap，加入数字 1-9
        const keyMap = {
        // 方向
        up:    { key: 'ArrowUp',    code: 'ArrowUp',    keyCode: 38 },
        down:  { key: 'ArrowDown',  code: 'ArrowDown',  keyCode: 40 },
        left:  { key: 'ArrowLeft',  code: 'ArrowLeft',  keyCode: 37 },
        right: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
        // 功能
        fire:  { key: 'Control',    code: 'ControlLeft', keyCode: 17 },
        enter: { key: 'Enter',      code: 'Enter',      keyCode: 13 },
        space: { key: ' ',          code: 'Space',      keyCode: 32 },
        escape:{ key: 'Escape',     code: 'Escape',     keyCode: 27 },
        // 数字 1-9
        digit1: { key: '1', code: 'Digit1', keyCode: 49 },
        digit2: { key: '2', code: 'Digit2', keyCode: 50 },
        digit3: { key: '3', code: 'Digit3', keyCode: 51 },
        digit4: { key: '4', code: 'Digit4', keyCode: 52 },
        digit5: { key: '5', code: 'Digit5', keyCode: 53 },
        digit6: { key: '6', code: 'Digit6', keyCode: 54 },
        digit7: { key: '7', code: 'Digit7', keyCode: 55 },
        digit8: { key: '8', code: 'Digit8', keyCode: 56 },
        digit9: { key: '9', code: 'Digit9', keyCode: 57 }
        };

        // 活动按键状态
        const activeKeys = { up: false, down: false, left: false, right: false };
        const activeButtons = {
        fire: false, enter: false, space: false, escape: false,
        digit1: false, digit2: false, digit3: false, digit4: false, digit5: false,
        digit6: false, digit7: false, digit8: false, digit9: false
        };

        function setKeyState(keyType, pressed) {
        const keyInfo = keyMap[keyType];
        if (!keyInfo) return;
        // 方向键单独处理，其他都放入 activeButtons
        if (keyType === 'up' || keyType === 'down' || keyType === 'left' || keyType === 'right') {
        if (activeKeys[keyType] === pressed) return;
        activeKeys[keyType] = pressed;
        } else {
        if (activeButtons[keyType] === pressed) return;
        activeButtons[keyType] = pressed;
        }
        const eventType = pressed ? 'keydown' : 'keyup';
        dispatchKeyEvent(eventType, keyInfo.key, keyInfo.code, keyInfo.keyCode);
        }

        // ---------- 摇杆 ----------
        const joystick = document.getElementById('joystick');
        const head = document.getElementById('joystick-head');
        let isDragging = false;
        let maxOffset = 45;
        const deadZone = 10;

        let rect = joystick.getBoundingClientRect();
        function updateRect() {
        rect = joystick.getBoundingClientRect();
        maxOffset = rect.width * 0.3;
        }
        window.addEventListener('resize', updateRect);

        function handleMove(clientX, clientY) {
        if (!isDragging) return;
        const dx = clientX - (rect.left + rect.width / 2);
        const dy = clientY - (rect.top + rect.height / 2);
        let distance = Math.sqrt(dx*dx + dy*dy);
        let limitedDx = dx, limitedDy = dy;
        if (distance > maxOffset) {
        limitedDx = (dx / distance) * maxOffset;
        limitedDy = (dy / distance) * maxOffset;
        }
        head.style.transform = `translate(${limitedDx}px, ${limitedDy}px)`;

        const x = limitedDx, y = limitedDy;
        if (Math.abs(x) > deadZone) {
        if (x > 0) {
        setKeyState('right', true);
        setKeyState('left', false);
        } else {
        setKeyState('left', true);
        setKeyState('right', false);
        }
        } else {
        setKeyState('left', false);
        setKeyState('right', false);
        }
        if (Math.abs(y) > deadZone) {
        if (y > 0) {
        setKeyState('down', true);
        setKeyState('up', false);
        } else {
        setKeyState('up', true);
        setKeyState('down', false);
        }
        } else {
        setKeyState('up', false);
        setKeyState('down', false);
        }
        }

        function startDrag(e) {
        e.preventDefault();
        isDragging = true;
        updateRect();
        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
        handleMove(clientX, clientY);
        }
        function onDrag(e) {
        if (!isDragging) return;
        e.preventDefault();
        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
        handleMove(clientX, clientY);
        }
        function stopDrag(e) {
        if (isDragging) {
        e.preventDefault();
        head.style.transform = `translate(0px, 0px)`;
        setKeyState('up', false);
        setKeyState('down', false);
        setKeyState('left', false);
        setKeyState('right', false);
        isDragging = false;
        }
        }

        joystick.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);
        joystick.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', onDrag, { passive: false });
        window.addEventListener('touchend', stopDrag);
        window.addEventListener('touchcancel', stopDrag);

        // ---------- 按钮绑定（通用函数）----------
        function bindButton(btnId, keyType) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        const onPress = (e) => {
        e.preventDefault();
        canvas.focus();
        setKeyState(keyType, true);
        };
        const onRelease = (e) => {
        e.preventDefault();
        setKeyState(keyType, false);
        };
        btn.addEventListener('mousedown', onPress);
        btn.addEventListener('mouseup', onRelease);
        btn.addEventListener('mouseleave', onRelease);
        btn.addEventListener('touchstart', onPress, { passive: false });
        btn.addEventListener('touchend', onRelease);
        btn.addEventListener('touchcancel', onRelease);
        }

        // 绑定原有按钮
        bindButton('fireBtn', 'fire');
        bindButton('enterBtn', 'enter');
        bindButton('spaceBtn', 'space');
        bindButton('escBtn', 'escape');

        // 绑定数字按钮 1-9
        bindButton('num1', 'digit1');
        bindButton('num2', 'digit2');
        bindButton('num3', 'digit3');
        bindButton('num4', 'digit4');
        bindButton('num5', 'digit5');
        bindButton('num6', 'digit6');
        bindButton('num7', 'digit7');
        bindButton('num8', 'digit8');
        bindButton('num9', 'digit9');

        // 全局释放（防止按键卡死）
        window.addEventListener('mouseup', (e) => {
        if (isDragging) return;
        setKeyState('up', false);
        setKeyState('down', false);
        setKeyState('left', false);
        setKeyState('right', false);
        // 同时释放所有数字键（保险）
        for (let i = 1; i <= 9; i++) {
        setKeyState('digit' + i, false);
        }
        });
        window.addEventListener('touchend', (e) => {
        if (isDragging) return;
        setKeyState('up', false);
        setKeyState('down', false);
        setKeyState('left', false);
        setKeyState('right', false);
        for (let i = 1; i <= 9; i++) {
        setKeyState('digit' + i, false);
        }
        });

        canvas.addEventListener('click', () => canvas.focus());
        window.addEventListener('load', () => canvas.focus());

        document.body.addEventListener('touchmove', (e) => {
        if (isDragging) e.preventDefault();
        }, { passive: false });

        // 初始化一次矩形
        updateRect();
        })();
    </script>
</body>
</html>
