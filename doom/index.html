<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOOM526</title>
    <style>
        /* ========== Windows 95 全局样式 ========== */
        body {
            margin: 0;
            padding: 0;
            background: #008080; /* 经典桌面背景 */
            font-family: "MS Sans Serif", "Arial", sans-serif;
            color: black;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1200px; /* 限制最大宽度，保证大屏幕不过大 */
            max-height: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 画布容器 */
        #canvas-container {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            width: 100%;
            margin-bottom: 15px;
            background: #c0c0c0;
            border: 3px solid #dfdfdf;
            border-right-color: #404040;
            border-bottom-color: #404040;
            padding: 10px;
            box-sizing: border-box;
        }

        canvas {
            display: block;
            width: auto;
            height: 100%;
            max-width: 100%;
            max-height: 70vh;
            background: #000;
            border: 2px solid #808080;
            outline: none;
            image-rendering: pixelated;
        }

        /* ========== 控制面板 (响应式) ========== */
        #controls-panel {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2vw; /* 使用视口宽度的比例，保证间距自适应 */
            padding: 2vh 2vw;
            background: #c0c0c0;
            border: 3px solid #dfdfdf;
            border-right-color: #404040;
            border-bottom-color: #404040;
            box-sizing: border-box;
            flex-wrap: nowrap; /* 禁止换行，让所有元素在同一行缩放 */
        }

        /* 摇杆区域 (左侧) */
        .joystick-area {
            flex: 0 0 auto; /* 不放大，不缩小，宽度由内部决定 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 120px; /* 最小宽度，防止太小时触摸困难 */
        }

        /* 摇杆容器 */
        .joystick {
            position: relative;
            width: 15vw; /* 基于视口宽度缩放 */
            max-width: 150px; /* 最大尺寸 */
            min-width: 100px; /* 最小尺寸，保持可操作 */
            aspect-ratio: 1 / 1; /* 保持正方形 */
            background: #a0a0a0;
            border: 3px solid #dfdfdf;
            border-right-color: #404040;
            border-bottom-color: #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
        }

            .joystick:active {
                cursor: grabbing;
            }

        /* 摇杆头部 */
        .joystick-head {
            width: 40%; /* 相对父容器比例 */
            aspect-ratio: 1 / 1;
            background: #c0c0c0;
            border: 3px solid #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            transition: transform 0.02s linear;
            pointer-events: none;
            will-change: transform;
            box-sizing: border-box;
        }

        /* 中间功能按钮区域 */
        .action-area {
            flex: 1 1 auto; /* 自动占据剩余空间，并允许缩放 */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5vw;
            min-width: 200px; /* 防止被压缩得太窄 */
        }

        .action-button {
            flex: 0 1 auto; /* 允许缩小，但不放大 */
            min-width: 70px;
            height: 7vh; /* 基于视口高度缩放 */
            max-height: 70px;
            min-height: 45px;
            background: #c0c0c0;
            border: 3px solid #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            color: black;
            font-size: clamp(14px, 2vw, 20px); /* 动态字体大小 */
            font-weight: bold;
            font-family: "MS Sans Serif", "Arial", sans-serif;
            padding: 0 2vw;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            text-transform: uppercase;
            white-space: nowrap;
            box-sizing: border-box;
            box-shadow: none;
            transition: none;
        }

            .action-button:active {
                border: 3px solid #808080;
                border-right-color: #ffffff;
                border-bottom-color: #ffffff;
                background: #a0a0a0;
                transform: translate(1px, 1px);
            }

        /* 射击按钮（右侧） */
        .fire-area {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 100px;
        }

        .fire-button {
            width: 12vw; /* 基于视口宽度缩放 */
            max-width: 120px;
            min-width: 80px;
            aspect-ratio: 1 / 1;
            background: #c0c0c0;
            border: 4px solid #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            color: black;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: bold;
            font-family: "MS Sans Serif", "Arial", sans-serif;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }

            .fire-button:active {
                border: 4px solid #808080;
                border-right-color: #ffffff;
                border-bottom-color: #ffffff;
                background: #a0a0a0;
                transform: translate(2px, 2px);
            }

        /* 底部提示 */
        .hint {
            color: white;
            font-size: clamp(12px, 1.5vw, 16px);
            margin-top: 10px;
            text-align: center;
            background: #000080;
            padding: 6px 20px;
            border: 2px solid #dfdfdf;
            border-right-color: #404040;
            border-bottom-color: #404040;
            font-family: "MS Sans Serif", "Arial", sans-serif;
            width: fit-content;
            max-width: 90%;
            white-space: nowrap;
        }

        /* ========== 隐藏辅助元素 ========== */
        .hidden-helper {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
            pointer-events: none;
        }

        #output {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* 极端小屏幕下的额外优化（例如宽度小于400px） */
        @media (max-width: 450px) {
            .action-button {
                font-size: 12px;
                padding: 0 5px;
                min-width: 50px;
            }

            .fire-button {
                font-size: 16px;
            }

            .hint {
                font-size: 10px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 保留所有 main.js 必需的隐藏元素 -->
    <div id="output"></div>
    <p id="focushint" class="hidden-helper"></p>
    <button id="enterButton" class="hidden-helper"></button>
    <button id="leftButton" class="hidden-helper"></button>
    <button id="upButton" class="hidden-helper"></button>
    <button id="downButton" class="hidden-helper"></button>
    <button id="rightButton" class="hidden-helper"></button>
    <button id="ctrlButton" class="hidden-helper"></button>
    <button id="spaceButton" class="hidden-helper"></button>
    <button id="altButton" class="hidden-helper"></button>
    <span id="getmsps_stats" class="hidden-helper">0</span>
    <span id="getms_stats" class="hidden-helper">0</span>
    <span id="fps_stats" class="hidden-helper">0</span>
    <span id="drawframes_stats" class="hidden-helper">0</span>
    <span id="animationfps_stats" class="hidden-helper">0</span>

    <div id="game-wrapper">
        <!-- 画布容器 -->
        <div id="canvas-container">
            <canvas id="screen" width="640" height="400" tabindex="0">This is where the DooM screen should render.</canvas>
        </div>

        <!-- 控制面板 (自适应布局) -->
        <div id="controls-panel">
            <!-- 左侧摇杆 -->
            <div class="joystick-area">
                <div class="joystick" id="joystick">
                    <div class="joystick-head" id="joystick-head"></div>
                </div>
            </div>

            <!-- 中间功能按钮：选择(Enter)、使用(Space)、返回(Esc) -->
            <div class="action-area">
                <div class="action-button" id="enterBtn">选择</div>
                <div class="action-button" id="spaceBtn">使用</div>
                <div class="action-button" id="escBtn">返回</div>
            </div>

            <!-- 右侧射击按钮 (Ctrl) -->
            <div class="fire-area">
                <div class="fire-button" id="fireBtn">射击</div>
            </div>
        </div>
        <!-- 底部提示 -->
        <div class="hint">拖动摇杆移动 · 点击射击 · 键盘同样可用</div>
    </div>

    <!-- 原有的 main.js 必须保留 -->
    <script src="main.js" defer></script>

    <!-- 自定义虚拟摇杆 + 按钮逻辑 (完全保留) -->
    <script>
        (function() {
        const canvas = document.getElementById('screen');

        // ---------- 键盘事件模拟器 ----------
        function dispatchKeyEvent(type, key, code, keyCode) {
        const event = new KeyboardEvent(type, {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
        });
        canvas.dispatchEvent(event);
        document.dispatchEvent(event);
        }

        const keyMap = {
        up:    { key: 'ArrowUp',    code: 'ArrowUp',    keyCode: 38 },
        down:  { key: 'ArrowDown',  code: 'ArrowDown',  keyCode: 40 },
        left:  { key: 'ArrowLeft',  code: 'ArrowLeft',  keyCode: 37 },
        right: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
        fire:  { key: 'Control',    code: 'ControlLeft', keyCode: 17 },
        enter: { key: 'Enter',      code: 'Enter',      keyCode: 13 },
        space: { key: ' ',          code: 'Space',      keyCode: 32 },
        escape:{ key: 'Escape',     code: 'Escape',     keyCode: 27 }
        };

        const activeKeys = { up: false, down: false, left: false, right: false };
        const activeButtons = { fire: false, enter: false, space: false, escape: false };

        function setKeyState(keyType, pressed) {
        const keyInfo = keyMap[keyType];
        if (!keyInfo) return;
        if (keyType === 'up' || keyType === 'down' || keyType === 'left' || keyType === 'right') {
        if (activeKeys[keyType] === pressed) return;
        activeKeys[keyType] = pressed;
        } else {
        if (activeButtons[keyType] === pressed) return;
        activeButtons[keyType] = pressed;
        }
        const eventType = pressed ? 'keydown' : 'keyup';
        dispatchKeyEvent(eventType, keyInfo.key, keyInfo.code, keyInfo.keyCode);
        }

        // ---------- 摇杆 ----------
        const joystick = document.getElementById('joystick');
        const head = document.getElementById('joystick-head');
        let isDragging = false;
        // 将最大偏移量设为摇杆容器尺寸的比例，使摇杆在小屏幕上也能合理移动
        let maxOffset = 45; // 初始默认值
        const deadZone = 10;

        let rect = joystick.getBoundingClientRect();
        function updateRect() {
        rect = joystick.getBoundingClientRect();
        // 根据当前摇杆大小动态调整最大偏移量（摇杆头移动范围）
        maxOffset = rect.width * 0.3; // 约30%的容器宽度
        }
        window.addEventListener('resize', updateRect);

        function handleMove(clientX, clientY) {
        if (!isDragging) return;
        const dx = clientX - (rect.left + rect.width / 2);
        const dy = clientY - (rect.top + rect.height / 2);
        let distance = Math.sqrt(dx*dx + dy*dy);
        let limitedDx = dx, limitedDy = dy;
        if (distance > maxOffset) {
        limitedDx = (dx / distance) * maxOffset;
        limitedDy = (dy / distance) * maxOffset;
        }
        head.style.transform = `translate(${limitedDx}px, ${limitedDy}px)`;

        const x = limitedDx, y = limitedDy;
        // 水平
        if (Math.abs(x) > deadZone) {
        if (x > 0) {
        setKeyState('right', true);
        setKeyState('left', false);
        } else {
        setKeyState('left', true);
        setKeyState('right', false);
        }
        } else {
        setKeyState('left', false);
        setKeyState('right', false);
        }
        // 垂直
        if (Math.abs(y) > deadZone) {
        if (y > 0) {
        setKeyState('down', true);
        setKeyState('up', false);
        } else {
        setKeyState('up', true);
        setKeyState('down', false);
        }
        } else {
        setKeyState('up', false);
        setKeyState('down', false);
        }
        }

        function startDrag(e) {
        e.preventDefault();
        isDragging = true;
        updateRect();
        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
        handleMove(clientX, clientY);
        }
        function onDrag(e) {
        if (!isDragging) return;
        e.preventDefault();
        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
        handleMove(clientX, clientY);
        }
        function stopDrag(e) {
        if (isDragging) {
        e.preventDefault();
        head.style.transform = `translate(0px, 0px)`;
        setKeyState('up', false);
        setKeyState('down', false);
        setKeyState('left', false);
        setKeyState('right', false);
        isDragging = false;
        }
        }

        joystick.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);
        joystick.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', onDrag, { passive: false });
        window.addEventListener('touchend', stopDrag);
        window.addEventListener('touchcancel', stopDrag);

        // 初始化更新一次rect
        updateRect();

        // ---------- 按钮绑定 ----------
        function bindButton(btnId, keyType) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        const keyInfo = keyMap[keyType];
        if (!keyInfo) return;

        const onPress = (e) => {
        e.preventDefault();
        canvas.focus();
        setKeyState(keyType, true);
        };
        const onRelease = (e) => {
        e.preventDefault();
        setKeyState(keyType, false);
        };

        btn.addEventListener('mousedown', onPress);
        btn.addEventListener('mouseup', onRelease);
        btn.addEventListener('mouseleave', onRelease);
        btn.addEventListener('touchstart', onPress, { passive: false });
        btn.addEventListener('touchend', onRelease);
        btn.addEventListener('touchcancel', onRelease);
        }

        bindButton('fireBtn', 'fire');
        bindButton('enterBtn', 'enter');
        bindButton('spaceBtn', 'space');
        bindButton('escBtn', 'escape');

        // 全局释放
        window.addEventListener('mouseup', (e) => {
        if (isDragging) return;
        setKeyState('up', false);
        setKeyState('down', false);
        setKeyState('left', false);
        setKeyState('right', false);
        });
        window.addEventListener('touchend', (e) => {
        if (isDragging) return;
        setKeyState('up', false);
        setKeyState('down', false);
        setKeyState('left', false);
        setKeyState('right', false);
        });

        canvas.addEventListener('click', () => canvas.focus());
        window.addEventListener('load', () => canvas.focus());

        document.body.addEventListener('touchmove', (e) => {
        if (isDragging) e.preventDefault();
        }, { passive: false });
        })();
    </script>
</body>
</html>
